[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biotoolkit-sequences"
version = "0.1.0"
description = "Small, transparent DNA sequence utilities for learning and reproducible analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.scripts]
biotoolkit = "biotoolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
